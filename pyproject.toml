[project]
name = "frontdesk-agent"
version = "0.5.0"
description = "Multi-tenant LLM agent service for appointment front offices, with human review."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "wordllama>=0.4,<0.5",
    "numpy>=1.26",
    "twilio>=9",
    "arq>=0.26",
    "python-multipart>=0.0.9",
    "pyjwt>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "faker>=25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontdesk_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts", "migrations", "evals"]
mypy_path = "src"

[[tool.mypy.overrides]]
# These ship no type information.
module = ["wordllama", "wordllama.*", "twilio", "twilio.*", "arq", "arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
