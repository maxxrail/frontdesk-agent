# Weekly update PRs; each runs the full CI, including the security job.
# Security updates for known vulnerabilities are enabled in the repo
# settings and arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The project targets Python 3.12 (CI, mypy, uv). Moving to a new
      # Python is a deliberate change, not a bot PR; patch images still come.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
