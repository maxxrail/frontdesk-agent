name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest

    # Same image as docker-compose, so CI tests what developers run.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: frontdesk
          POSTGRES_PASSWORD: frontdesk
          POSTGRES_DB: frontdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontdesk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      FDA_DATABASE_URL: postgresql+psycopg://frontdesk:frontdesk@localhost:5432/frontdesk
      FDA_TEST_DATABASE_URL: postgresql+psycopg://frontdesk:frontdesk@localhost:5432/frontdesk_test
      FDA_TEST_REDIS_URL: redis://localhost:6379/15
      # Throwaway: CI signs no real tokens. The app refuses to start without one.
      FDA_JWT_SECRET: ci-only-not-a-secret-0123456789abcdef0123456789

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: Migrations apply to a fresh database
        run: uv run alembic upgrade head

      - name: Models and migrations agree
        run: uv run alembic check

      - name: Seed script runs (clinics, clients and policy documents)
        run: uv run python scripts/seed.py

      - name: Re-ingesting unchanged policies is a no-op
        run: |
          out=$(uv run python scripts/ingest_policies.py); echo "$out"
          # Every tenant line must report 0 re-ingested.
          ! echo "$out" | grep -v " 0 re-ingested"

      - name: pytest
        # CI=true (set by GitHub) makes a missing database fail, not skip.
        # Includes the retrieval quality floor (tests/test_retrieval_quality.py).
        run: uv run pytest -rs

      - name: Retrieval report
        run: uv run python evals/retrieval.py

      - name: Upload retrieval report
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-report
          path: evals/reports/

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan every commit, not just the last

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: pip-audit (known vulnerabilities in locked dependencies)
        # Audits exactly what uv.lock pins, runtime and dev, without installing.
        run: |
          uv export --format requirements-txt --no-emit-project --extra dev > /tmp/req.txt
          uvx pip-audit@2.9.0 -r /tmp/req.txt --disable-pip --progress-spinner off

      - name: gitleaks (secrets in any commit)
        # Reviewed false positives are listed in .gitleaksignore.
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4             detect --source /repo --redact --no-banner

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t frontdesk-agent:ci .

      - name: Image can load its prompts and embedder
        # Catches files missing from the image, which /healthz never would.
        run: |
          docker run --rm frontdesk-agent:ci python -c "
          from frontdesk_agent.prompts import load_prompt
          from frontdesk_agent.retrieval.embeddings import default_embedder
          load_prompt('reminder_draft', 'v1'); load_prompt('policy_answer', 'v1')
          load_prompt('agent', 'v1'); load_prompt('agent', 'v2')
          from frontdesk_agent.worker import WorkerSettings
          assert {f.__qualname__ for f in WorkerSettings.functions} == {
              'handle_inbound', 'start_slot_fill', 'expire_offer'}
          assert len(default_embedder().embed(['ok'])[0]) == 256
          print('prompts and embedder ok')"

      - name: Container answers /healthz
        run: |
          docker run -d --name fda -p 8000:8000 \
            -e FDA_JWT_SECRET=ci-only-not-a-secret-0123456789abcdef0123456789 \
            frontdesk-agent:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/healthz; then
              echo "healthy"; docker rm -f fda; exit 0
            fi
            sleep 1
          done
          echo "service never became healthy"; docker logs fda; docker rm -f fda; exit 1
