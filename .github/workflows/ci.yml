name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t frontdesk-agent:ci .

      - name: Container answers /healthz
        run: |
          docker run -d --name fda -p 8000:8000 frontdesk-agent:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/healthz; then
              echo "healthy"; docker rm -f fda; exit 0
            fi
            sleep 1
          done
          echo "service never became healthy"; docker logs fda; docker rm -f fda; exit 1
